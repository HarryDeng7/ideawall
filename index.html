<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Wall</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<header class="topbar">
  <h1 class="logo">Idea Wall</h1>
  <nav id="wallBar" class="wall-bar"></nav>
  <div class="tools">
    <span class="hint">Click to add an idea - pick a tool, then hold left click</span>
    <button id="penBtn" class="tool-btn" type="button" title="Draw">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
    </button>
    <button id="eraserBtn" class="tool-btn" type="button" title="Erase">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </button>
  </div>
</header>

<div id="penPanel" class="context-panel hidden">
  <div class="ctx-section">
    <span class="ctx-label">Shape</span>
    <div class="ctx-row">
      <button type="button" class="ctx-opt" data-mode="free" title="Pencil">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
      </button>
      <button type="button" class="ctx-opt" data-mode="line" title="Straight line">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      </button>
      <button type="button" class="ctx-opt" data-mode="arrow" title="Arrow">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </button>
    </div>
  </div>
  <div class="ctx-section">
    <span class="ctx-label">Size</span>
    <div class="ctx-row">
      <button type="button" class="ctx-opt" data-width="2" title="Thin"><span class="dot d2"></span></button>
      <button type="button" class="ctx-opt" data-width="4" title="Medium"><span class="dot d4"></span></button>
      <button type="button" class="ctx-opt" data-width="8" title="Thick"><span class="dot d8"></span></button>
    </div>
  </div>
  <div class="ctx-section">
    <span class="ctx-label">Color</span>
    <div class="ctx-row">
      <button type="button" class="ctx-swatch" data-color="#2b1b0d" style="background:#2b1b0d" title="Dark brown"></button>
      <button type="button" class="ctx-swatch" data-color="#1f2937" style="background:#1f2937" title="Slate"></button>
      <button type="button" class="ctx-swatch" data-color="#dc2626" style="background:#dc2626" title="Red"></button>
      <button type="button" class="ctx-swatch" data-color="#2563eb" style="background:#2563eb" title="Blue"></button>
      <button type="button" class="ctx-swatch" data-color="#16a34a" style="background:#16a34a" title="Green"></button>
      <button type="button" class="ctx-swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
    </div>
  </div>
</div>

<div id="eraserPanel" class="context-panel hidden">
  <div class="ctx-section">
    <span class="ctx-label">Eraser size</span>
    <div class="ctx-row slider-row">
      <input type="range" id="eraserRange" class="ctx-range" min="8" max="80" step="2" value="42">
      <span id="eraserSizeLabel" class="ctx-value">42</span>
    </div>
  </div>
</div>

<div id="textPanel" class="context-panel text-panel hidden">
  <div class="ctx-section">
    <span class="ctx-label">Font</span>
    <div class="ctx-row">
      <button type="button" class="ctx-font" data-font="inherit">默认</button>
      <button type="button" class="ctx-font" data-font="SimSun, '宋体', serif">宋体</button>
      <button type="button" class="ctx-font" data-font="SimHei, '黑体', sans-serif">黑体</button>
      <button type="button" class="ctx-font" data-font="KaiTi, '楷体', serif">楷体</button>
      <button type="button" class="ctx-font" data-font="'Microsoft YaHei', '微软雅黑', sans-serif">雅黑</button>
    </div>
  </div>
  <div class="ctx-section">
    <span class="ctx-label">Size</span>
    <div class="ctx-row">
      <button type="button" class="ctx-size" data-size="14">14</button>
      <button type="button" class="ctx-size" data-size="18">18</button>
      <button type="button" class="ctx-size" data-size="22">22</button>
      <button type="button" class="ctx-size" data-size="28">28</button>
      <button type="button" class="ctx-size" data-size="36">36</button>
    </div>
  </div>
  <div class="ctx-section">
    <span class="ctx-label">Color</span>
    <div class="ctx-row">
      <button type="button" class="ctx-swatch" data-color="#1f2937" style="background:#1f2937" title="Black"></button>
      <button type="button" class="ctx-swatch" data-color="#2b1b0d" style="background:#2b1b0d" title="Dark brown"></button>
      <button type="button" class="ctx-swatch" data-color="#dc2626" style="background:#dc2626" title="Red"></button>
      <button type="button" class="ctx-swatch" data-color="#2563eb" style="background:#2563eb" title="Blue"></button>
      <button type="button" class="ctx-swatch" data-color="#16a34a" style="background:#16a34a" title="Green"></button>
      <button type="button" class="ctx-swatch" data-color="#f59e0b" style="background:#f59e0b" title="Orange"></button>
    </div>
  </div>
</div>

<main id="wall" class="wall">
  <canvas id="drawCanvas"></canvas>
  <div id="notesLayer" class="notes-layer"></div>
  <div id="emptyHint" class="empty-hint hidden">
    <p id="emptyTitle" class="empty-title">Your wall is empty</p>
    <p>Click anywhere to stick your first idea</p>
  </div>

  <div id="toolCursor" class="tool-cursor hidden">
    <div class="pen-ic">
      <svg width="22" height="26" viewBox="0 0 22 26" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="0" width="10" height="3" rx="1.5" fill="#f87171"/>
        <rect x="6" y="3" width="10" height="2.5" fill="#94a3b8"/>
        <rect x="6" y="5.5" width="10" height="9.5" rx="1" fill="#f59e0b"/>
        <path d="M6 15 L11 25 L16 15 Z" fill="#fcd9b6"/>
        <path d="M9.7 15 L11 25 L12.3 15 Z" fill="#334155"/>
      </svg>
    </div>
    <div id="eraserRing" class="eraser-ring">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </div>
  </div>
</main>

<div id="noteModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div id="modalNote" class="modal-note">
      <p id="modalText" class="modal-text"></p>
      <div id="modalEdit" class="modal-edit hidden" contenteditable="true" spellcheck="false" data-placeholder="Write something..."></div>
    </div>
    <div class="modal-actions">
      <button id="editBtn" class="btn" type="button">Edit</button>
      <button id="saveBtn" class="btn btn-accent hidden" type="button">Save</button>
      <button id="deleteBtn" class="btn btn-danger" type="button">Delete</button>
      <button id="closeBtn" class="btn btn-ghost" type="button">Close</button>
    </div>
  </div>
</div>

<script src="app.js?v=9"></script>
</body>
</html>
