<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Wall</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<header class="topbar">
  <h1 class="logo">Idea Wall</h1>
  <nav id="wallBar" class="wall-bar"></nav>
  <div class="tools">
    <span class="hint">Right-click to add an idea - pick a tool, then hold left click</span>
    <button id="penBtn" class="tool-btn" type="button" title="Draw">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
    </button>
    <button id="eraserBtn" class="tool-btn" type="button" title="Erase">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </button>
  </div>
</header>

<main id="wall" class="wall">
  <canvas id="drawCanvas"></canvas>
  <div id="notesLayer" class="notes-layer"></div>
  <div id="emptyHint" class="empty-hint hidden">
    <p id="emptyTitle" class="empty-title">Your wall is empty</p>
    <p>Right-click anywhere to stick your first idea</p>
  </div>

  <div id="toolCursor" class="tool-cursor hidden">
    <div class="pen-ic">
      <svg width="22" height="26" viewBox="0 0 22 26" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="0" width="10" height="3" rx="1.5" fill="#f87171"/>
        <rect x="6" y="3" width="10" height="2.5" fill="#94a3b8"/>
        <rect x="6" y="5.5" width="10" height="9.5" rx="1" fill="#f59e0b"/>
        <path d="M6 15 L11 25 L16 15 Z" fill="#fcd9b6"/>
        <path d="M9.7 15 L11 25 L12.3 15 Z" fill="#334155"/>
      </svg>
    </div>
    <div class="eraser-ring">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </div>
  </div>
</main>

<div id="noteModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div id="modalNote" class="modal-note">
      <p id="modalText" class="modal-text"></p>
      <textarea id="modalEdit" class="modal-edit hidden"></textarea>
    </div>
    <div class="modal-actions">
      <button id="editBtn" class="btn" type="button">Edit</button>
      <button id="saveBtn" class="btn btn-accent hidden" type="button">Save</button>
      <button id="deleteBtn" class="btn btn-danger" type="button">Delete</button>
      <button id="closeBtn" class="btn btn-ghost" type="button">Close</button>
    </div>
  </div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
